<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>session-multiselect browser smoke</title>
<!--
  Real-browser smoke test for the header injection.

  Node tests drive the bundle against DOM and React stand-ins; this page drives
  it against the real things: real React 18 UMD, a real layout engine, and the
  header CSS copied from @deepseek-ai/dsh-client-ui-workspace. It answers the
  questions a stand-in cannot: where the injected button actually lands, what
  element is on top of it, and whether a real click opens the panel.

  Run (headless, verdict is dumped into <pre id="verdict">):
    chrome --headless=new --disable-gpu --allow-file-access-from-files \
      --virtual-time-budget=8000 --dump-dom tests/browser/click.html
-->
<style>
  /* Copied from the workspace plugin's WorkspaceBrowser.module.css, so the
     layout the plugin meets in the app is the layout it meets here. */
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--dsw-alias-bg-base, #f8f8f6); color: var(--dsw-alias-label-primary, #222); }
  /* The theme tokens as a dark build defines them — deliberately WITHOUT
     `--dsw-alias-bg-elevated`, which DSH 0.2 does not ship. A surface that fell
     back to a light default there would paint light text on a light bar, and the
     harness asserts the resulting contrast, so that regression cannot come back. */
  :root {
    --dsw-alias-label-primary: #e8e8ea;
    --dsw-alias-label-secondary: #a0a0a8;
    --dsw-alias-label-tertiary: #7a7a82;
    --dsw-alias-border-l1: #ffffff1f;
    --dsw-alias-border-l4: #ffffff1f;
    --dsw-alias-interactive-bg-hover: #ffffff14;
    --dsw-alias-bg-base: #141416;
    --dsw-alias-bg-layer-1: #191a1c;
    --dsw-alias-bg-layer-2: #1f2023;
    --dsw-alias-bg-module-platform: #232327;
    --dsw-alias-bg-mask-1: #000000a6;
    --dsw-alias-state-business-primary: #4d6bfe;
    --dsw-alias-state-error-primary: #ff6b6b;
  }
  /* The app ships a base reset; without it the user-agent button box would make
     the harness's numbers differ from the app's for reasons unrelated to the
     plugin (the row gap is 4px in both). */
  button { border: 0; padding: 0; margin: 0; background: transparent; font: inherit; color: inherit; }
  #sidebar { width: 260px; min-height: 520px; background: var(--dsw-alias-bg-layer-1, #f1f1ef); }
  .sectionHeader { height: 36px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; padding-left: 4px; overflow: hidden; }
  .sectionLabel { flex: none; line-height: 20px; overflow: hidden; font-size: 12px; color: #6b6b6b; }
  .searchSlot { box-sizing: border-box; min-width: 0; max-width: 28px; flex: 1; align-items: center; margin-left: auto; padding-left: 0; display: flex; }
  .search { box-sizing: border-box; cursor: text; width: 100%; height: 28px; flex: none; align-items: center; gap: 0; margin: 0; padding: 0; display: flex; overflow: hidden; border-radius: 50%; background: transparent; border: none; }
  .searchButton { width: 28px; height: 30px; background: transparent; border: none; cursor: pointer; }
  .searchInput { opacity: 0; pointer-events: none; width: 0; min-width: 0; flex: 1; background: transparent; border: none; outline: none; }
  .headerActions { max-width: 60px; flex: none; align-items: center; gap: 4px; display: flex; overflow: hidden; }
  .headerActions button { width: 28px; height: 28px; background: transparent; border: none; }
  /* The session rows, as the workspace plugin renders them: a 32px flex row whose
     inline-start padding reserves the leading 16px cell. Inline mode ticks it.
     Deliberately WITHOUT box-sizing: the shell's session-row rule does not set it,
     so a row that gains padding would grow — which is what pushed the real sidebar
     sideways until the tick's gutter pinned the row to border-box. */
  .sessionRow { display: flex; align-items: center; gap: 0; height: 32px; padding: 0 8px; border-radius: 8px; cursor: pointer; color: #222; }
  /* The list scrolls vertically, and must never move sideways: a row that grew by
     the tick's gutter would show up right here as scrollWidth > clientWidth. */
  .sessionList { display: flex; flex-direction: column; overflow-x: hidden; overflow-y: auto; }
  .sessionRow:hover { background: #0000000d; }
  .slot { width: 16px; height: 20px; flex: none; }
  .title { margin: 0 6px 0 4px; font-size: 14px; line-height: 20px; }
  #verdict { margin: 12px; padding: 10px; background: #fff; border: 1px solid #ddd; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="sectionHeader">
    <span class="sectionLabel">工作区</span>
    <div class="searchSlot">
      <div class="search">
        <button type="button" class="searchButton" aria-label="搜索会话"></button>
        <input type="text" class="searchInput" placeholder="搜索会话…" />
      </div>
    </div>
    <div class="headerActions">
      <button type="button" aria-label="新建会话"></button>
      <button type="button" aria-label="更多"></button>
    </div>
  </div>
  <!-- Rows carry the shell's own data-row-key: the only stable handle on a
       session row, and where inline mode reads the id from. Their own click
       handler records navigation, which is what must NOT happen in inline mode. -->
  <div class="sessionList">
    <div class="sessionRow" data-row-key="session:a" role="treeitem" tabindex="0"><span class="slot"></span><span class="title">第一个对话</span></div>
    <div class="sessionRow" data-row-key="session:b" role="treeitem" tabindex="0"><span class="slot"></span><span class="title">第二个对话</span></div>
    <div class="sessionRow" data-row-key="session:c" role="treeitem" tabindex="0"><span class="slot"></span><span class="title">第三个对话</span></div>
    <div class="sessionRow" data-row-key="session:d" role="treeitem" tabindex="0"><span class="slot"></span><span class="title">没有工作区的对话</span></div>
  </div>
</div>

<!-- Real React 18 UMD builds, straight from the desktop app's own dependency tree.
     Served by tests/browser/harness.mjs, which also serves the bundle under test
     and the plugin's lib/ directory. -->
<script src="/react/react.development.js"></script>
<script src="/react-dom/react-dom.development.js"></script>
<!-- The bundle under test registers itself through this loader hook. -->
<script>
  window.__ModuleLoader__ = { load: (registration) => { window.__smokeRegistration = registration; } };
</script>
<script src="/plugin/lib/client.js"></script>
<script>
const results = [];
const record = (key, value) => { results.push([key, value]); };
const errors = [];
window.addEventListener('error', (event) => errors.push(String(event.message)));
const nativeError = console.error;
console.error = (...args) => { errors.push(args.map(String).join(' ')); nativeError(...args); };
const h = React.createElement;

// --- module table stand-ins -------------------------------------------------

/** Faithful-enough jsx runtime: the real one is createElement plus folding. */
function makeJsxRuntime() {
  const build = (type, props) => {
    const { children, ...rest } = props ?? {};
    const kids = children === undefined ? [] : Array.isArray(children) ? children : [children];
    return React.createElement(type, rest, ...kids);
  };
  return { jsx: build, jsxs: build, Fragment: React.Fragment };
}

function makeSnapshotStore(init) {
  let state = init;
  const listeners = new Set();
  const notify = () => { for (const fn of [...listeners]) fn(); };
  return {
    getSnapshot: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    set(next) { state = next; notify(); },
    update(mutate) { const draft = JSON.parse(JSON.stringify(state)); mutate(draft); state = draft; notify(); }
  };
}

const clientStore = {
  defineStore: (decl) => ({
    create: () => {
      const store = makeSnapshotStore(decl.init());
      const actions = {};
      for (const key of Object.keys(decl.actions)) {
        actions[key] = (...params) => store.update((draft) => decl.actions[key](draft, ...params));
      }
      return { actions, getSnapshot: store.getSnapshot, subscribe: store.subscribe, store };
    }
  }),
  createSnapshotStore: (init) => makeSnapshotStore(init)
};

/** Tooltip mirrors the real one: clones the anchor, adds no wrapper element. */
function Tooltip({ label, children }) {
  const ref = React.useRef(null);
  return React.cloneElement(children, {
    ref,
    onMouseEnter() {}, onMouseLeave() {}, onFocus() {}, onBlur() {}
  });
}

/** Modal mirrors the real one: null when closed, portal to body when open, and
    the mask closes it on click. */
function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return ReactDOM.createPortal(
    h('div', { 'data-fake-modal': 'true' },
      h('div', { 'data-fake-mask': 'true', onClick: onClose }),
      h('h2', null, title),
      h('div', { 'data-fake-modal-body': 'true' }, children)),
    document.body
  );
}

function Icon(props) { return h('svg', { width: props.size ?? 16, height: props.size ?? 16 }); }

/** The real Button forwards refs (the plugin tooltips it) and handles clicks;
    a stub that dropped either would make the panel look inert here. */
const Button = React.forwardRef(function Button(props, ref) {
  return h('button', {
    ref,
    type: 'button',
    className: props.className,
    disabled: props.disabled,
    'data-armed': props['data-armed'],
    onClick: props.onClick
  }, props.children);
});

const primitives = {
  Modal,
  Tooltip,
  Button,
  Input: (props) => h('input', { placeholder: props.placeholder }),
  // The names DSH 0.10 ships; 0.9 used IconSearchOutline16 and friends, and the
  // plugin resolves whichever exists (falling back to its own artwork).
  IconSearchOutlineRegular: Icon,
  IconChecklistOutlineRegular: Icon,
  IconLoadingOutlineRegular: Icon,
  IconPinOutlineRegular: Icon,
  IconCheckOutlineRegular: Icon
};

// --- fake plugin context ----------------------------------------------------

// The controller hands the UI a NORMALIZED snapshot — ids + byId + current +
// phase — not a flattened items array. The harness uses the real shape, so a
// panel that listed nothing would fail here. The rows span three workspaces, so
// the grouping has something real to lay out: two sessions in one workspace, one
// in another, and one with no recorded workspace at all.
const summaries = [
  { sessionId: 'a', title: '第一个对话', blank: false, cwd: 'D:/work/alpha', updatedAt: 30 },
  { sessionId: 'b', title: '第二个对话', blank: false, cwd: 'D:/work/alpha', updatedAt: 20 },
  { sessionId: 'c', title: '第三个对话', blank: false, cwd: 'D:/work/beta', updatedAt: 10 },
  { sessionId: 'd', title: '没有工作区的对话', blank: false, updatedAt: 5 }
];
const byId = {};
for (const summary of summaries) byId[summary.sessionId] = summary;
const listState = {
  ids: summaries.map((summary) => summary.sessionId),
  byId,
  current: undefined,
  state: 'idle',
  phase: 'ready',
  error: null
};
const sessions = {
  list: { getSnapshot: () => listState, subscribe: () => () => {} },
  get: () => ({
    open: async () => {},
    loadOlder: async () => {},
    getSnapshot: () => ({ hasMore: false }),
    events: { entries: () => [] },
    prompt: async () => ({ ok: true })
  }),
  // Recorded, so the harness can prove a batch really reached the service.
  delete: async (sessionId) => { window.__smokeDeleted.push(sessionId); },
  fork: async () => {}, create: async () => 'x', open: () => {}
};
window.__smokeDeleted = [];
// The row's own click, which inline mode must pre-empt: opening a conversation
// in the middle of ticking rows would lose the selection.
window.__smokeOpened = [];
for (const row of document.querySelectorAll('[data-row-key^="session:"]')) {
  row.addEventListener('click', () => { window.__smokeOpened.push(row.getAttribute('data-row-key')); });
}
// The workspace controller: pinning and archiving are its commands, so the
// harness stands it up the way the app provides it (through `ctx.get`).
function makeWorkspaces() {
  const calls = { pinned: [], unpinned: [], archived: [], unarchived: [] };
  const listeners = new Set();
  let state = { pinnedSessionIds: [], archivedSessionIds: [] };
  const publish = (next) => { state = next; for (const fn of [...listeners]) fn(); };
  return {
    calls,
    list: { getSnapshot: () => state, subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); } },
    async pinSession(id) { calls.pinned.push(id); publish({ ...state, pinnedSessionIds: [id, ...state.pinnedSessionIds.filter((x) => x !== id)] }); },
    async unpinSession(id) { calls.unpinned.push(id); publish({ ...state, pinnedSessionIds: state.pinnedSessionIds.filter((x) => x !== id) }); },
    async archiveSession(id) { calls.archived.push(id); publish({ ...state, archivedSessionIds: [...state.archivedSessionIds, id] }); },
    async unarchiveSession(id) { calls.unarchived.push(id); publish({ ...state, archivedSessionIds: state.archivedSessionIds.filter((x) => x !== id) }); }
  };
}
const workspaces = makeWorkspaces();
const ctx = {
  effect: (fn) => { const dispose = fn(); return typeof dispose === 'function' ? dispose : () => {}; },
  locale: { register: () => () => {}, subscribe: () => () => {} },
  slots: { inject: () => () => {}, register: () => ({}) },
  get: (name) => (name === 'workspaces' ? workspaces : undefined),
  sessions
};

// --- drive it ---------------------------------------------------------------

const frame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
const round = (n) => Math.round(n * 100) / 100;
const box = (rect) => [round(rect.left), round(rect.top), round(rect.width), round(rect.height)];

async function run() {
  // A failure halfway through still has to produce a verdict: the records already
  // taken are what say where it stopped, and the diagnostic ring comes with them.
  try {
    await drive();
  } catch (error) {
    record('driveError', String(error?.stack ?? error));
  }
  finish();
}

async function drive() {
  const registration = window.__smokeRegistration;
  if (registration === undefined) throw new Error('the bundle did not register itself');
  // `?noprimitives=1` reproduces a client that seeds neither the primitives nor
  // the client store — DSH 0.2 seeds React, Cordis and static libraries only, and
  // its authoring guide says not to require a Harness client package at all. The
  // bundle must draw its own chrome there, so this page asks for exactly that.
  const noPrimitives = new URLSearchParams(window.location.search).has('noprimitives');
  const table = new Map([
    ['react', React],
    ['react-dom/client', { createRoot: (container) => ReactDOM.createRoot(container) }],
    // `createPortal` lives on react-dom, exactly as it does in the app.
    ['react-dom', { createPortal: ReactDOM.createPortal }],
    ['react/jsx-runtime', makeJsxRuntime()]
  ]);
  if (!noPrimitives) {
    table.set('@deepseek-ai/dsh-client-store', clientStore);
    table.set('@deepseek-ai/dsh-client-ui-primitives', primitives);
  }
  const exports = registration.factory((spec) => {
    // A module the table does not hold throws, exactly as the real one does.
    if (!table.has(spec)) throw new Error(`unknown module ${spec}`);
    return table.get(spec);
  });
  record('exportsApply', typeof exports.apply);
  if (noPrimitives) {
    await driveWithoutPrimitives(exports);
    return;
  }

  exports.apply(ctx);
  await frame(); await frame(); await frame();

  const button = document.querySelector('.dsh-msel-inline');
  const host = document.querySelector('[data-dsh-msel-host]');
  const magnifier = document.querySelector('.searchButton');
  const slot = document.querySelector('.searchSlot');
  record('hostAttached', host !== null && document.body.contains(host));
  record('buttonRendered', button !== null);
  if (button === null || host === null) { finish(); return; }

  record('hostParent', host.parentElement === slot ? 'searchSlot' : host.parentElement.className);
  record('hostInlineRight', host.style.right);
  record('hostComputedRight', getComputedStyle(host).right);
  record('hostPosition', getComputedStyle(host).position);
  // A drag region swallows pointer events before they become DOM events, so the
  // opt-out has to actually resolve — not merely be assigned.
  record('hostAppRegion', getComputedStyle(host).webkitAppRegion || '(empty)');
  record('hostZIndex', getComputedStyle(host).zIndex);
  record('slotOverflow', getComputedStyle(slot).overflow);
  const hostBox = box(host.getBoundingClientRect());
  const buttonBox = box(button.getBoundingClientRect());
  const magnifierBox = box(magnifier.getBoundingClientRect());
  const actionBox = box(document.querySelector('.headerActions button').getBoundingClientRect());
  record('hostBox', hostBox);
  record('buttonBox', buttonBox);
  record('magnifierBox', magnifierBox);
  record('gapToMagnifier', round(magnifierBox[0] - (buttonBox[0] + buttonBox[2])));
  record('nativeGapMagnifierToAction', round(actionBox[0] - (magnifierBox[0] + magnifierBox[2])));
  record('buttonBoxWidth', buttonBox[2]);

  // What is actually on top of the injected button's centre?
  const cx = buttonBox[0] + buttonBox[2] / 2;
  const cy = buttonBox[1] + buttonBox[3] / 2;
  const top = document.elementFromPoint(cx, cy);
  record('elementFromPoint', top === null ? null : `${top.tagName.toLowerCase()}.${top.className}`);
  record('hitTestReachesButton', top !== null && (top === button || button.contains(top) || host.contains(top)));

  // The real question: does a real click actually do something?
  button.click();
  await frame(); await frame();

  // --- inline mode: the ticks and the bar ---------------------------------
  const barOf = () => document.querySelector('[data-dsh-msel-bar]');
  const barButton = (label) => [...(barOf()?.querySelectorAll('button') ?? [])].find((node) => node.textContent === label) ?? null;
  const rows = [...document.querySelectorAll('[data-row-key^="session:"]')];
  const marks = () => rows.map((row) => row.querySelector('.dsh-msel-mark'));
  const ticked = () => marks().map((mark) => mark?.getAttribute('data-selected') ?? null);

  const bar = barOf();
  record('inlineBarAttached', bar !== null);
  record('inlineBarParent', bar?.parentElement?.id ?? null);
  record('inlineMarkCount', marks().filter((mark) => mark !== null).length);
  // The gutter is reserved out of the row's own padding (8px + 22px), so the
  // shell's status dot, title, and time keep their places.
  record('rowPaddingStart', getComputedStyle(rows[0]).paddingInlineStart);
  const markBox = box(marks()[0].getBoundingClientRect());
  const titleBox = box(rows[0].querySelector('.title').getBoundingClientRect());
  const rowBox = box(rows[0].getBoundingClientRect());
  record('markBox', markBox);
  record('rowBox', rowBox);
  record('rowComputed', (() => {
    const style = getComputedStyle(rows[0]);
    return { position: style.position, paddingInlineStart: style.paddingInlineStart, display: style.display };
  })());
  record('markHostComputed', (() => {
    const host = rows[0].querySelector('[data-dsh-msel-mark]');
    if (host === null) return null;
    const style = getComputedStyle(host);
    return { position: style.position, left: style.left, insetInlineStart: style.insetInlineStart, width: style.width, display: style.display, inlineOffset: host.offsetLeft };
  })());
  record('markHostParent', rows[0].querySelector('[data-dsh-msel-mark]')?.parentElement?.className ?? null);
  // The gutter must cost the list nothing: the row keeps its column's width, and
  // the list never gains a horizontal scroll (that was the real sidebar's symptom:
  // the whole panel slid sideways as soon as the ticks appeared).
  record('listWidth', { client: document.querySelector('.sessionList').clientWidth, scroll: document.querySelector('.sessionList').scrollWidth });
  record('rowWidth', round(rows[0].getBoundingClientRect().width));
  // The page itself must be untouched: the body carries only this plugin's own
  // mode class, and — the trap this guards — NOT the entry button's class, whose
  // 28px inline-flex rules would lay the whole window out as one button.
  record('bodyStyle', (() => {
    const style = getComputedStyle(document.body);
    return {
      display: style.display,
      width: style.width,
      picking: document.body.classList.contains('dsh-msel-picking'),
      hasEntryClass: document.body.classList.contains('dsh-msel-inline')
    };
  })());
  record('markLeftOfTitle', markBox[0] + markBox[2] <= titleBox[0]);
  record('markVerticallyCentered', round(markBox[1] + markBox[3] / 2 - (rowBox[1] + rowBox[3] / 2)));
  record('markOnTop', (() => {
    const node = document.elementFromPoint(markBox[0] + markBox[2] / 2, markBox[1] + markBox[3] / 2);
    return node !== null && (node.classList.contains('dsh-msel-mark') || node.parentElement?.classList.contains('dsh-msel-markHost'));
  })());
  record('elementAtMark', (() => {
    const node = document.elementFromPoint(markBox[0] + markBox[2] / 2, markBox[1] + markBox[3] / 2);
    return node === null ? null : `${node.tagName.toLowerCase()}.${String(node.className).split(' ')[0]}${node.parentElement === null ? '' : ` < ${node.parentElement.tagName.toLowerCase()}.${String(node.parentElement.className).split(' ')[0]}`}`;
  })());

  // A click on the row's own title ticks it — and the row's own click handler,
  // which would open that conversation, never runs.
  rows[1].querySelector('.title').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
  await frame();
  record('tickedAfterRowClick', ticked());
  record('openedAfterRowClick', window.__smokeOpened.length);
  // The tick itself is a toggle too.
  marks()[1].click();
  await frame();
  record('tickedAfterMarkClick', ticked());

  // 全选 takes every row on screen.
  barButton('全选').click();
  await frame();
  record('tickedAfterSelectAll', ticked());
  record('barCount', barOf().querySelector('.dsh-msel-barCount').textContent);
  // The bar's own colours: a surface token that a build does not ship must not
  // fall back to a light default under dark-theme text (that made the bar
  // unreadable in DSH 0.2, where only the layered tokens exist).
  record('barColors', (() => {
    const style = getComputedStyle(barOf().querySelector('.dsh-msel-bar'));
    return { color: style.color, background: style.backgroundColor };
  })());

  // 置顶 is the workspace controller's command — not a private mark — and the
  // button flips to its own reverse once the selection carries the mark.
  barButton('置顶').click();
  await frame(); await frame();
  record('pinnedIds', workspaces.calls.pinned.slice());
  record('pinButtonFlip', [...barOf().querySelectorAll('button')].map((node) => node.textContent).includes('取消置顶'));

  // Esc leaves the mode and takes the ticks and the bar with it.
  document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame(); await frame();
  record('inlineAfterEscape', barOf() === null && marks().every((mark) => mark === null));
  record('rowPaddingAfterEscape', getComputedStyle(rows[0]).paddingInlineStart);
  record('boxSizingAfterEscape', getComputedStyle(rows[0]).boxSizing);

  // --- the other mode, from the button's own right-click -------------------
  // Nothing else is on screen at this point, which is exactly the situation the
  // gesture exists for: the mode you are not in, without hunting for a switch.
  const rightClick = () => button.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
  rightClick();
  await frame(); await frame();
  record('modalAfterRightClick', document.querySelector('[data-fake-modal]') !== null);
  record('ticksAfterRightClick', marks().filter((mark) => mark !== null).length);
  document.querySelector('[data-fake-mask]')?.click();
  await frame(); await frame();
  // …and the same gesture comes back the other way.
  rightClick();
  await frame(); await frame();
  record('ticksAfterRightClickBack', marks().filter((mark) => mark !== null).length);
  record('modalAfterRightClickBack', document.querySelector('[data-fake-modal]') !== null);
  document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await frame(); await frame();
  record('inlineClosedAgain', barOf() === null);

  // --- the panel, reached through the bar's mode switch --------------------
  button.click(); // inline mode on again
  await frame(); await frame();
  barButton('面板').click();
  await frame(); await frame();
  record('modalAfterPanelSwitch', document.querySelector('[data-fake-modal]') !== null);

  // ...and does the open panel really lay the conversations out by workspace?
  const groups = [...document.querySelectorAll('.dsh-msel-group')];
  const headingText = (group) => group.querySelector('.dsh-msel-groupName')?.textContent ?? '';
  record('groupHeadings', groups.map(headingText));
  record('rowTitles', [...document.querySelectorAll('.dsh-msel-row .dsh-msel-title')].map((node) => node.textContent));
  record('rowsPerHeading', groups.map((group) => {
    // Rows that follow this heading in paint order, up to the next heading.
    let count = 0;
    for (let node = group.nextElementSibling; node !== null && !node.classList.contains('dsh-msel-group'); node = node.nextElementSibling) {
      if (node.classList.contains('dsh-msel-row')) count += 1;
    }
    return count;
  }));
  // A whole workspace in one click, through the real React handler.
  groups[0]?.click();
  await frame(); await frame();
  record('selectedAfterGroupClick', [...document.querySelectorAll('.dsh-msel-row')].map((row) => row.getAttribute('data-selected')));

  // Close it the way a user does — through the mask — so React really unmounts
  // the portal, then click the button again at its centre with a dispatched
  // MouseEvent. (Removing React's DOM by hand would leave React thinking the
  // portal is still mounted, and the second click would prove nothing.)
  document.querySelector('[data-fake-mask]')?.click();
  await frame(); await frame();
  record('modalClosedAgain', document.querySelector('[data-fake-modal]') === null);

  const dispatchTarget = document.elementFromPoint(cx, cy) ?? button;
  dispatchTarget.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
  await frame(); await frame();
  record('modalAfterDispatchedClick', document.querySelector('[data-fake-modal]') !== null);

  // --- back to inline through the panel's own switch, then a batch ---------
  const switchButton = [...document.querySelectorAll('.dsh-msel-toolbar button')].find((node) => node.textContent === '内联勾选');
  switchButton?.click();
  await frame(); await frame();
  record('inlineAfterPanelSwitch', barOf() !== null && document.querySelector('[data-fake-modal]') === null);
  record('ticksAfterPanelSwitch', marks().filter((mark) => mark !== null).length);

  barButton('全选').click();
  await frame();
  barButton('归档').click();
  await frame(); await frame();
  record('archivedIds', workspaces.calls.archived.slice());
  record('archiveButtonFlip', [...barOf().querySelectorAll('button')].map((node) => node.textContent).includes('取消归档'));

  // Deleting from the bar asks first, then reaches the service once per id.
  barButton('删除').click();
  await frame();
  record('confirmVisible', barOf().textContent.includes('永久删除'));
  record('deletedBeforeConfirm', window.__smokeDeleted.length);
  barButton('永久删除').click();
  await frame(); await frame();
  record('deletedIds', window.__smokeDeleted.slice());
}

/**
 * The same plugin on a client that seeds no platform packages.
 *
 * This is the DSH 0.2 shape: the bundle has to bring its own dialog, its own
 * controls and its own store, and the whole feature still has to be there. The
 * records below are the ones that can only be answered in a real browser.
 */
async function driveWithoutPrimitives(exports) {
  exports.apply(ctx);
  await frame(); await frame(); await frame();

  const button = document.querySelector('.dsh-msel-inline');
  record('fallbackButtonRendered', button !== null);
  record('fallbackIcon', button === null ? null : button.querySelector('svg') !== null);
  if (button === null) return;

  // Inline mode is the default: one tick per row, and a bar over the list.
  button.click();
  await frame(); await frame();
  const rows = [...document.querySelectorAll('[data-row-key^="session:"]')];
  record('fallbackTicks', rows.filter((row) => row.querySelector('.dsh-msel-mark') !== null).length);
  record('fallbackBar', document.querySelector('[data-dsh-msel-bar]') !== null);

  // The other mode, and this time the dialog is the bundle's own: a portal with
  // role="dialog", the panel inside it, and the bundle's own input control.
  button.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
  await frame(); await frame();
  const dialog = document.querySelector('.dsh-msel-modal[role="dialog"]');
  record('fallbackDialog', dialog !== null);
  record('fallbackDialogLabel', dialog?.getAttribute('aria-label') ?? null);
  record('fallbackPanelInside', dialog?.querySelector('.dsh-msel-root') !== null);
  record('fallbackOwnInput', dialog?.querySelector('input.dsh-msel-input') !== null);
  record('fallbackGroups', dialog?.querySelectorAll('.dsh-msel-group').length ?? 0);
  // The preference the entry button reads is persisted by the bundle's own store.
  record('fallbackPersisted', (() => {
    try {
      return JSON.parse(localStorage.getItem('dsh.session.multiselect.v1') ?? '{}').mode ?? null;
    } catch {
      return 'unreadable';
    }
  })());

  // The mask closes it, and no platform dialog was involved anywhere.
  dialog?.parentElement?.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  await frame(); await frame();
  record('fallbackDialogClosed', document.querySelector('.dsh-msel-modal') === null);
}

function finish() {
  record('errors', errors);
  // The diagnostic ring is the channel a shipped plugin can be inspected
  // through, so the harness proves it is actually written.
  try {
    record('diagTrail', JSON.parse(sessionStorage.getItem('dsh.session.multiselect.diag') ?? '[]'));
  } catch (error) {
    record('diagTrail', `unreadable: ${String(error)}`);
  }
  const pre = document.createElement('pre');
  pre.id = 'verdict';
  pre.textContent = JSON.stringify(Object.fromEntries(results), null, 1);
  document.body.appendChild(pre);
}

run().catch((error) => {
  const pre = document.createElement('pre');
  pre.id = 'verdict';
  pre.textContent = `ERROR: ${error?.stack ?? error}`;
  document.body.appendChild(pre);
});
</script>
</body>
</html>
